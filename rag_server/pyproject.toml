[project]
name = "solrag"
version = "0.1.0"
description = "SolAgent knowledge server: repository snapshot, hybrid search, fix solutions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.5",
]

[project.optional-dependencies]
push = [
    "google-auth>=2.30",
    "requests>=2.31",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["solrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: needs the real embedding model (downloads ~470 MB on first run)",
]
addopts = "-m 'not model'"

# Installed by deploy/root-setup.sh. Only this site is added; other sites are not touched.
limit_req_zone $binary_remote_addr zone=solrag:5m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/solrag-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    server_tokens off;
    limit_req_status 429;

    error_page 413 = @e413;
    error_page 429 = @e429;
    error_page 502 503 504 = @e503;

    location @e413 {
        default_type application/json;
        return 413 '{"status":413,"code":"payload_too_large","message":"Request body is too large"}';
    }
    location @e429 {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"status":429,"code":"rate_limited","message":"Too many requests"}';
    }
    location @e503 {
        default_type application/json;
        return 503 '{"status":503,"code":"unavailable","message":"Service temporarily unavailable"}';
    }

    location / {
        limit_req zone=solrag burst=20 nodelay;
        proxy_pass http://127.0.0.1:8795;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}